<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cutline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="frame" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 3h2v8H2zm4 0h2v8H6zm4 0h2v8h-2z" fill="currentColor"/></svg>
        </div>
        <span id="brand-name">Cutline</span>
      </div>
      <div class="search" id="search-bar" role="search"><span>Search boards</span><span style="margin-left:auto;font-family:var(--mono);font-size:11px">⌘K</span></div>
      <div class="right" id="top-right">Local</div>
    </header>
    <nav class="sidebar" aria-label="Primary">
      <div class="nav-label">Workspace</div>
      <button type="button" class="nav-item" data-nav="boards">
        <svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
        Boards
      </button>
      <button type="button" class="nav-item" data-nav="pipeline">
        <svg viewBox="0 0 16 16"><path d="M3 3h10v2H3zm0 4h10v2H3zm0 4h7v2H3z"/></svg>
        Pipeline
        <span class="count" id="pipeline-count"></span>
      </button>
      <button type="button" class="nav-item" data-nav="library">
        <svg viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="8" rx="1"/><path d="M6 4V3h4v1"/></svg>
        Library
      </button>
      <div style="flex:1"></div>
      <button type="button" class="nav-item" data-nav="settings">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"/><path d="M8 5v3l2 1"/></svg>
        Settings
      </button>
    </nav>
    <main class="sheet" id="sheet"></main>
  </div>

  <div class="modal-backdrop" id="modal"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
